# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates

---
version: 2

updates:
  # Actions used by the workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One pull request per run, so related action bumps are reviewed
      # and merged together
      github-actions:
        patterns:
          - '*'

  # The plugin's runtime and build packages
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Build and lint packages move together and are not shipped
      development:
        dependency-type: development
      runtime:
        dependency-type: production
    ignore:
      # The linting packages track the versions Super Linter bundles, so
      # the editor and CI evaluate the same rules (see D13). Raise these
      # when Super Linter ships the next major.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@typescript-eslint/*'
        update-types: [version-update:semver-major]
      - dependency-name: eslint-plugin-jsonc
        update-types: [version-update:semver-major]
      - dependency-name: globals
        update-types: [version-update:semver-major]
      # Node's types follow the Node version Stream Deck runs the plugin
      # on, which the manifest sets, rather than the newest Node
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7 is outside the peer range @typescript-eslint 8
      # accepts, and the Elgato plugin template is still on 5 (see D18)
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # The base image the development container builds on
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
