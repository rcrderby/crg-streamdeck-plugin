---
# Pre-commit hooks for crg-streamdeck-plugin.
#
# One-time setup, from inside the development container:
#   pre-commit install
#
# Run against all files on demand:
#   pre-commit run --all-files

repos:
  # Secret scanning: block commits that contain API keys or tokens.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
