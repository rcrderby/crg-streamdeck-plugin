<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CRG Connection</title>
  </head>
  <body>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>

    <sdpi-item label="Scoreboard">
      <sdpi-textfield global setting="host" placeholder="localhost"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Port">
      <sdpi-textfield global setting="port" placeholder="8000"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Use TLS">
      <sdpi-checkbox global setting="secure"></sdpi-checkbox>
    </sdpi-item>
  </body>
</html>
