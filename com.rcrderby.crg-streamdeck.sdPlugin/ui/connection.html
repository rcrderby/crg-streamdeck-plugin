<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CRG Connection</title>
  </head>
  <body>
    <script src="sdpi-components.js"></script>

    <sdpi-item>
      <div id="description"></div>
    </sdpi-item>
    <sdpi-item label="CRG URL">
      <sdpi-textfield global setting="url" placeholder="http://localhost:8000"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item>
      <p>The URL applies to all CRG keys in this Stream Deck Profile</p>
    </sdpi-item>
    <sdpi-item label="CRG Operator">
      <sdpi-select global setting="operator" datasource="operators" placeholder="StreamDeck"></sdpi-select>
    </sdpi-item>
    <sdpi-item>
      <sdpi-button id="operator-reveal">Create CRG Operator</sdpi-button>
    </sdpi-item>
    <sdpi-item label="New Profile" id="operator-form" hidden>
      <div class="operator-row">
        <input id="operator-name" type="text" placeholder="Profile name" autocomplete="off" spellcheck="false" />
        <sdpi-button id="operator-create" disabled>Create</sdpi-button>
      </div>
    </sdpi-item>
    <sdpi-item id="operator-note-item" hidden>
      <p id="operator-note"></p>
    </sdpi-item>
    <sdpi-item>
      <p>The deck keeps its settings under the CRG operator {operator}, and leaves the default profile alone.</p>
    </sdpi-item>
    <sdpi-item>
      <p>While connected to CRG, your computer will remain awake.</p>
    </sdpi-item>
    <script src="operators.js"></script>
    <script src="descriptions.js"></script>
  </body>
</html>
