<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Official Review Options</title>
  </head>
  <body>
    <script src="sdpi-components.js"></script>

    <sdpi-item>
      <div id="description"></div>
    </sdpi-item>
    <sdpi-item label="Team">
      <sdpi-select setting="team" default="1">
        <option value="1">Team 1</option>
        <option value="2">Team 2</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Function">
      <sdpi-select setting="option" default="retained">
        <option value="retained">Review Retained</option>
        <option value="timeout">As a Team Timeout</option>
      </sdpi-select>
    </sdpi-item>
    <script src="descriptions.js"></script>
  </body>
</html>
